<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDGs 永續島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="game.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <div class="kicker">SDGs Island <span class="pill stage-pill" id="stagePill"></span><span class="pill">CEFR B1–B2</span></div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="both">雙語</button><button data-lang="zh">中文</button><button data-lang="en">EN</button>
      </div>
    </div>
    <h1 id="h1"></h1>
    <p id="intro"></p>
  </header>

  <div class="hud" id="hud"></div>

  <div class="stage">
    <div class="mapbox">
      <div class="tools">
        <button class="chip-btn" id="toggleLines" aria-pressed="true"></button>
        <button class="chip-btn" id="randomIsle"></button>
        <button class="chip-btn" id="resetBtn"></button>
      </div>
      <svg id="map" viewBox="0 0 360 330" role="group" aria-label="SDGs islands map"></svg>
    </div>
    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </div>

  <section class="panel">
    <h3 id="ledgerH"></h3>
    <p class="sub" id="ledgerSub"></p>
    <div class="cells" id="cells"></div>
  </section>

  <section class="panel">
    <h3 id="badgeH"></h3>
    <p class="sub" id="badgeSub"></p>
    <div class="badges" id="badges"></div>
  </section>

  <section class="panel">
    <h3 id="endH"></h3>
    <p class="sub" id="endSub"></p>
    <div class="titlecard" id="titlecard"></div>
  </section>

  <footer>Gina的SDGs多元選修課</footer>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>window.SDG_MODE="basic";</script>
<script src="game.js"></script>
</body>
</html>
