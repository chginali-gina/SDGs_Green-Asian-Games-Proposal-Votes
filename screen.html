<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04251c">
<title>大螢幕｜SDGs 綠色亞運提案投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { min-height: 100vh; }
  .timer { transform-origin: top left; }
  @media (min-width: 900px) { .timer { transform: scale(1.45); } .timer.danger { animation: pulseBig .5s ease-in-out infinite alternate; } }
  @keyframes pulseBig { from { transform: scale(1.45); } to { transform: scale(1.6); } }

  .bar-top { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 18px 20px 0 260px; min-height: 96px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { border: 2px solid var(--line); background: rgba(0,0,0,.3); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 900; font-size: 15px; }
  .tab.sel { border-color: var(--lime); color: var(--lime); }
  .tab.done { background: rgba(198,255,61,.12); }
  .tab.done::after { content: ' ✓'; color: var(--lime); }
  .tab.live { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse .6s infinite alternate; }
  .icon-btn { border: 2px solid var(--line); background: rgba(0,0,0,.3); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 900; font-size: 15px; }

  .stage { max-width: 1280px; margin: 0 auto; padding: 18px 28px 40px; }

  /* 登入 */
  .login { max-width: 460px; margin: 10vh auto 0; padding: 34px; text-align: center; }
  .login h1 { font-size: 30px; margin: 8px 0 6px; }
  .login input { width: 100%; font-size: 22px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: rgba(0,0,0,.35); color: var(--ink); margin: 18px 0 14px; outline: none; text-align: center; }
  .login input:focus { border-color: var(--lime); }
  .login .btn { width: 100%; }

  /* 提案大字卡 */
  .hero { text-align: center; padding: 2vh 0 0; }
  .grp { display: inline-block; font-family: var(--display); font-size: clamp(16px, 2vw, 24px); color: #052; background: var(--lime); padding: 6px 18px; border-radius: 12px; letter-spacing: .06em; }
  .grp.zh { font-family: var(--body); font-weight: 900; }
  .ptitle { font-size: clamp(30px, 5.2vw, 72px); line-height: 1.2; font-weight: 900; margin: 18px auto 10px; max-width: 18em; text-wrap: balance; }
  .pdesc { font-size: clamp(16px, 2vw, 26px); color: var(--muted); margin: 0 auto; max-width: 30em; }

  /* idle */
  .idle-row { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; margin-top: 5vh; }
  .go { font-size: clamp(22px, 2.8vw, 34px); padding: 22px 46px; }
  .join { display: flex; gap: 16px; align-items: center; padding: 16px; }
  .join .qr { background: #fff; padding: 8px; border-radius: 12px; width: 156px; height: 156px; }
  .join .qr img, .join .qr canvas { width: 140px !important; height: 140px !important; }
  .join .url { font-size: 15px; color: var(--muted); max-width: 260px; word-break: break-all; }
  .join .url b { color: var(--ink); font-size: 20px; display: block; margin-bottom: 4px; }
  .center { text-align: center; }

  /* 投票中 */
  .live-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: end; margin-top: 4vh; }
  .ballot { position: relative; height: 300px; }
  .ballot .bin { position: absolute; left: 50%; bottom: 0; width: 300px; margin-left: -150px; height: 190px; border-radius: 16px 16px 28px 28px;
    background: linear-gradient(#1c6b4f, #0b4532); border: 4px solid var(--lime); box-shadow: 0 0 50px rgba(198,255,61,.3), inset 0 -20px 40px rgba(0,0,0,.3); display: grid; place-items: center; }
  .ballot .bin .q { font-family: var(--display); font-size: 70px; color: var(--lime); text-shadow: 0 0 20px rgba(198,255,61,.6); }
  .ballot .slot { position: absolute; left: 50%; bottom: 168px; width: 170px; margin-left: -85px; height: 12px; background: #021; border-radius: 6px; z-index: 3; }
  .ballot .pp { position: absolute; left: 50%; top: 0; width: 56px; height: 70px; margin-left: -28px; background: #fff; border-radius: 6px; z-index: 2;
    animation: paper 1s cubic-bezier(.5,0,.75,1) forwards; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  .ballot .pp::before { content: ''; position: absolute; inset: 14px 10px auto; height: 4px; background: #cfd8d2; box-shadow: 0 10px 0 #cfd8d2, 0 20px 0 #cfd8d2; border-radius: 2px; }
  @keyframes paper { 0% { transform: translate(var(--x), -40px) rotate(var(--r)); opacity: 0; } 20% { opacity: 1; } 80% { transform: translate(0, 120px) rotate(0); opacity: 1; } 100% { transform: translate(0, 150px); opacity: 0; } }
  .turn { text-align: center; }
  .turn .big { font-family: var(--display); font-size: clamp(80px, 12vw, 170px); line-height: 1; color: var(--sun); text-shadow: 0 0 40px rgba(255,210,63,.45); font-variant-numeric: tabular-nums; }
  .turn .big small { font-size: .35em; color: var(--muted); text-shadow: none; }
  .turn .lbl { font-size: 24px; font-weight: 900; color: var(--muted); }
  .turn .big.bump { animation: bump .3s; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .meter { height: 16px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 18px auto 0; max-width: 420px; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), var(--sun)); width: 0; transition: width .5s; }
  .secret { margin-top: 14px; font-weight: 900; color: var(--pink); letter-spacing: .1em; }
  .live-actions { text-align: center; margin-top: 30px; }

  /* 時間到 / 開票中 */
  .stamp { position: fixed; inset: 0; display: grid; place-items: center; z-index: 80; pointer-events: none; }
  .stamp span { font-family: var(--display); font-size: clamp(70px, 14vw, 200px); color: var(--danger); border: 12px solid var(--danger); padding: 0 40px; border-radius: 30px; transform: rotate(-10deg);
    background: rgba(0,0,0,.6); animation: stampIn .45s cubic-bezier(.2,1.6,.4,1) both; text-shadow: 0 0 40px rgba(255,59,59,.6); }
  @keyframes stampIn { from { transform: rotate(-10deg) scale(3); opacity: 0; } }
  .counting { text-align: center; padding-top: 10vh; }
  .drum { font-size: 130px; display: inline-block; animation: drum .12s infinite alternate; }
  @keyframes drum { to { transform: translateY(-10px) rotate(6deg); } }
  .counting h2 { font-size: clamp(36px, 5vw, 64px); margin: 10px 0; }
  .suspense { display: flex; gap: 14px; justify-content: center; margin-top: 20px; }
  .suspense i { width: 26px; height: 26px; border-radius: 50%; background: var(--lime); animation: hop .9s infinite; }
  .suspense i:nth-child(2) { background: var(--sun); animation-delay: .15s; } .suspense i:nth-child(3) { background: var(--sky); animation-delay: .3s; }
  @keyframes hop { 50% { transform: translateY(-24px); } }

  /* 揭曉 */
  .reveal-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; margin-top: 3vh; }
  .side { padding: 22px; text-align: center; }
  .side .n { font-family: var(--display); font-size: clamp(80px, 11vw, 160px); line-height: 1; font-variant-numeric: tabular-nums; }
  .side .l { font-size: clamp(20px, 2.4vw, 32px); font-weight: 900; margin-top: 6px; }
  .side.y .n { color: var(--yes); text-shadow: 0 0 40px rgba(62,240,138,.5); } .side.x .n { color: var(--no); text-shadow: 0 0 40px rgba(255,90,95,.45); }
  .side.win { border-color: currentColor; box-shadow: 0 0 60px rgba(62,240,138,.35); }
  .side.y.win { color: var(--yes); } .side.x.win { color: var(--no); box-shadow: 0 0 60px rgba(255,90,95,.35); }
  .side.win .l { color: var(--ink); }
  .vs { font-family: var(--display); font-size: 48px; color: var(--muted); }
  .race { height: 30px; border-radius: 99px; overflow: hidden; display: flex; background: rgba(255,255,255,.1); margin-top: 22px; }
  .race .by { background: linear-gradient(90deg, #1fb862, var(--yes)); width: 50%; transition: width 1.6s cubic-bezier(.2,.8,.2,1); display: flex; align-items: center; padding-left: 14px; font-weight: 900; color: #052; }
  .race .bn { background: linear-gradient(90deg, var(--no), #c93136); width: 50%; transition: width 1.6s cubic-bezier(.2,.8,.2,1); display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; font-weight: 900; }
  .verdict { text-align: center; margin-top: 24px; min-height: 120px; }
  .verdict span { display: inline-block; font-family: var(--display); font-size: clamp(54px, 8vw, 110px); padding: 0 30px; border-radius: 22px; border: 8px solid; transform: rotate(-4deg); animation: stampIn .5s cubic-bezier(.2,1.6,.4,1) both; }
  .verdict .pass { color: var(--yes); border-color: var(--yes); text-shadow: 0 0 30px rgba(62,240,138,.6); }
  .verdict .fail { color: var(--no); border-color: var(--no); }
  .verdict .tie { color: var(--sun); border-color: var(--sun); }
  .wall-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 14px; flex-wrap: wrap; }
  .wall-h h3 { font-size: clamp(22px, 2.6vw, 34px); margin: 0; }
  .wall-h small { color: var(--muted); }
  .wall { columns: 4 240px; column-gap: 16px; }
  .sticky { break-inside: avoid; display: inline-block; width: 100%; margin-top: 10px !important; background: #fff6b3; color: #2a2610; padding: 16px 18px 18px; border-radius: 4px 18px 18px 18px; margin: 0 0 16px; font-size: clamp(17px, 1.6vw, 22px); font-weight: 700; line-height: 1.45;
    box-shadow: 0 10px 22px rgba(0,0,0,.35); transform: rotate(var(--r)); opacity: 0; animation: stick .45s cubic-bezier(.2,1.5,.4,1) forwards; cursor: pointer; position: relative; }
  .sticky::before { content: ''; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; margin-left: -32px; background: rgba(255,255,255,.55); transform: rotate(-3deg); }
  .sticky:nth-child(4n+2) { background: #d8ffb8; } .sticky:nth-child(4n+3) { background: #c9f1ff; } .sticky:nth-child(4n) { background: #ffd6ea; }
  .sticky.gone { opacity: .12 !important; filter: blur(3px); }
  @keyframes stick { from { opacity: 0; transform: rotate(var(--r)) scale(.4) translateY(-30px); } to { opacity: 1; transform: rotate(var(--r)); } }
  .reveal-actions { display: flex; gap: 14px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }

  /* 總結果 */
  .summary h2 { text-align: center; font-size: clamp(34px, 4.6vw, 60px); margin: 0 0 6px; }
  .rank { display: grid; grid-template-columns: 70px 1fr 220px; gap: 18px; align-items: center; padding: 16px 20px; margin-bottom: 12px; opacity: 0; animation: drop .5s forwards; }
  @keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
  .rank .m { font-size: 46px; text-align: center; font-family: var(--display); color: var(--muted); }
  .rank .t { font-size: clamp(18px, 2vw, 26px); font-weight: 900; }
  .rank .t small { display: block; font-size: 14px; color: var(--muted); font-weight: 700; }
  .rank .pct { font-family: var(--display); font-size: 34px; text-align: right; }
  .rank .rb { height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); margin-top: 8px; overflow: hidden; }
  .rank .rb i { display: block; height: 100%; background: var(--yes); }
  .rank.pass .pct { color: var(--yes); } .rank.fail .pct { color: var(--no); } .rank.tie .pct { color: var(--sun); } .rank.none .pct { color: var(--muted); font-size: 20px; }
  .rank.gold { border-color: var(--sun); box-shadow: 0 0 40px rgba(255,210,63,.3); }

  @media (max-width: 820px) {
    .bar-top { padding-left: 16px; padding-top: 90px; justify-content: center; }
    .idle-row, .live-row, .reveal-row { grid-template-columns: 1fr; }
    .vs { display: none; }
    .rank { grid-template-columns: 50px 1fr; } .rank .pct { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<div class="bar-top hidden" id="topbar">
  <div class="tabs" id="tabs"></div>
  <button class="icon-btn" id="sumBtn">🏆 總結果</button>
  <button class="icon-btn" id="muteBtn" title="音效">🔊</button>
  <button class="icon-btn" id="fsBtn" title="全螢幕">⛶</button>
</div>

<main class="stage">
  <!-- 登入 -->
  <section class="card login" id="mLogin">
    <div class="kicker" id="evTitle"></div>
    <h1>老師大螢幕</h1>
    <p class="lead" style="color:var(--muted)">輸入老師密碼後開始控場。<br>建議接上喇叭，音效會讓氣氛更緊張！</p>
    <input type="password" id="pw" placeholder="老師密碼" autocomplete="current-password">
    <button class="btn" id="pwBtn">進入控場 ▶</button>
  </section>

  <!-- 待命 -->
  <section class="hidden" id="mIdle">
    <div class="hero">
      <div class="kicker">NEXT UP · 準備投票</div>
      <div style="margin-top:14px"><span class="grp zh" id="iG"></span></div>
      <div class="ptitle" id="iTitle"></div>
      <p class="pdesc" id="iDesc"></p>
    </div>
    <div class="idle-row">
      <div class="center"><button class="btn go" id="goBtn">▶ 開始投票（60 秒）</button>
        <p style="color:var(--muted);margin-top:16px">按下後全班手機同步倒數，時間到立刻開票</p></div>
      <div class="card join"><div class="qr" id="qr"></div><div class="url"><b>📱 掃碼投票</b><span id="joinUrl"></span></div></div>
    </div>
  </section>

  <!-- 投票中 -->
  <section class="hidden" id="mOpen">
    <div class="hero">
      <div><span class="grp zh" id="oG"></span></div>
      <div class="ptitle" id="oTitle"></div>
    </div>
    <div class="live-row">
      <div class="ballot" id="ballot"><div class="slot"></div><div class="bin"><div class="q">?</div></div></div>
      <div class="turn">
        <div class="lbl">已投票人數</div>
        <div class="big" id="turn">0<small> / 0</small></div>
        <div class="meter"><i id="meter"></i></div>
        <div class="secret">🤫 贊成？不贊成？時間到才揭曉</div>
      </div>
    </div>
    <div class="live-actions"><button class="btn ghost" id="stopBtn">⏹ 提前結束</button></div>
  </section>

  <!-- 開票中 -->
  <section class="hidden counting" id="mCount">
    <div class="drum">🥁</div>
    <h2>開票中…</h2>
    <p style="color:var(--muted);font-size:22px" id="cTitle"></p>
    <div class="suspense"><i></i><i></i><i></i></div>
  </section>

  <!-- 揭曉 -->
  <section class="hidden" id="mReveal">
    <div class="hero">
      <div><span class="grp zh" id="rG"></span></div>
      <div class="ptitle" id="rTitle" style="font-size:clamp(26px,3.6vw,50px)"></div>
    </div>
    <div class="reveal-row">
      <div class="card side y" id="sideY"><div class="n" id="rYes">0</div><div class="l">👍 贊成</div></div>
      <div class="vs">VS</div>
      <div class="card side x" id="sideN"><div class="n" id="rNo">0</div><div class="l">👎 不贊成</div></div>
    </div>
    <div class="race"><div class="by" id="raceY"></div><div class="bn" id="raceN"></div></div>
    <div class="verdict" id="verdict"></div>
    <div class="wall-h"><h3>💬 贊成理由（<span id="rCount">0</span>）</h3><small>匿名・順序已打亂・點一下便利貼可暫時遮住</small></div>
    <div class="wall" id="wall"></div>
    <div class="reveal-actions">
      <button class="btn ghost" id="againBtn">↺ 這組重投</button>
      <button class="btn sun" id="nextBtn">下一組 ▶</button>
    </div>
  </section>

  <!-- 總結果 -->
  <section class="hidden summary" id="mSum">
    <div class="kicker center">FINAL RESULTS</div>
    <h2>🏆 六組提案總結果</h2>
    <p class="center" style="color:var(--muted);margin:0 0 26px">依贊成率排序</p>
    <div id="ranks"></div>
    <div class="reveal-actions"><button class="btn ghost" id="backBtn">← 回到控場</button></div>
  </section>
</main>

<div class="vignette" id="vig"></div>
<div class="credit" id="credit"></div>

<script src="config.js?v=2"></script>
<script src="assets/common.js?v=2"></script>
<script>
(function () {
  const K = window.VoteKit, CFG = K.CFG, $ = id => document.getElementById(id);
  const timer = K.mountTimer();
  timer.el.classList.add('hidden');
  const modes = ['mLogin', 'mIdle', 'mOpen', 'mCount', 'mReveal', 'mSum'];
  let pw = '', st = null, mode = 'mLogin', sel = 1, lastTurn = 0, lastSec = -1, revealing = 0, revealedRound = 0, stamped = 0;

  $('evTitle').textContent = (CFG.EVENT_TITLE || '') + ' · ' + (CFG.EVENT_SUBTITLE || '');
  $('credit').textContent = CFG.CREDIT || '';
  const voteUrl = new URL('vote.html' + (K.DEMO && new URLSearchParams(location.search).get('demo') ? '?demo=1' : ''), location.href).href;
  $('joinUrl').textContent = voteUrl.replace(/^https?:\/\//, '');
  try { new QRCode($('qr'), { text: voteUrl, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { $('qr').style.display = 'none'; }

  function show(m) {
    mode = m;
    modes.forEach(x => $(x).classList.toggle('hidden', x !== m));
    $('topbar').classList.toggle('hidden', m === 'mLogin');
    timer.el.classList.toggle('hidden', m === 'mLogin');
    if (m !== 'mOpen') { $('vig').classList.remove('on'); document.querySelector('.stage').classList.remove('shake'); }
  }

  function prop(r) { return (st && st.proposals[r - 1]) || { g: '第 ' + r + ' 組', title: '', desc: '' }; }

  function tabs() {
    if (!st) return;
    const live = st.round && K.serverNow() < st.endAt ? st.round : 0;
    let h = '';
    for (let i = 1; i <= K.ROUNDS; i++) {
      const c = ['tab'];
      if (i === sel) c.push('sel');
      if ((st.done || []).indexOf(i) >= 0) c.push('done');
      if (i === live) c.push('live');
      h += '<button class="' + c.join(' ') + '" data-r="' + i + '">第' + i + '組</button>';
    }
    $('tabs').innerHTML = h;
  }
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    const r = +b.dataset.r;
    if (st && st.round && K.serverNow() < st.endAt) { K.toast('投票進行中，請先等這一輪結束'); return; }
    sel = r;
    if ((st.done || []).indexOf(r) >= 0) { revealedRound = 0; reveal(r, true); } else idle();
    tabs();
  });

  function idle() {
    const p = prop(sel);
    $('iG').textContent = p.g; $('iTitle').textContent = p.title; $('iDesc').textContent = p.desc || '';
    timer.set(null, 60000, '每組 60 秒');
    show('mIdle'); tabs();
  }

  /* ---------- 登入 ---------- */
  async function doLogin() {
    pw = $('pw').value.trim();
    K.SFX.unlock();
    $('pwBtn').disabled = true;
    try {
      const r = await K.api('login', { pw });
      if (!r.ok) { K.toast(r.error || '密碼錯誤', true); return; }
      try { sessionStorage.setItem('sdgsPw', pw); } catch (e) {}
      const sent = Date.now();
      const s = await K.api('state');
      K.syncClock(s.now, sent); st = s;
      const doneSet = s.done || [];
      sel = 1; for (let i = 1; i <= K.ROUNDS; i++) if (doneSet.indexOf(i) < 0) { sel = i; break; }
      if (s.round && K.serverNow() < s.endAt) { sel = s.round; openMode(); }
      else idle();
      poll();
    } catch (e) { K.toast('連線失敗：請確認 config.js 的 API 網址', true); }
    finally { $('pwBtn').disabled = false; }
  }
  $('pwBtn').onclick = doLogin;
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (K.DEMO) { $('pw').placeholder = '示範模式：直接按進入'; }

  /* ---------- 開始投票 ---------- */
  $('goBtn').onclick = async () => {
    K.SFX.unlock();
    $('goBtn').disabled = true;
    try {
      const sent = Date.now();
      const r = await K.api('start', { pw, r: sel });
      if (!r.ok) { K.toast(r.error || '無法開始', true); return; }
      K.syncClock(r.now, sent);
      st.round = r.round; st.endAt = r.endAt; st.turnout = 0;
      st.done = (st.done || []).filter(x => x !== r.round);
      openMode();
      K.SFX.start();
    } catch (e) { K.toast('連線失敗', true); }
    finally { $('goBtn').disabled = false; }
  };

  function openMode() {
    const p = prop(st.round);
    $('oG').textContent = p.g; $('oTitle').textContent = p.title;
    lastTurn = st.turnout || 0; lastSec = -1; stamped = 0; revealing = 0;
    setTurn(lastTurn, false);
    $('ballot').querySelectorAll('.pp').forEach(x => x.remove());
    show('mOpen'); tabs();
  }

  function setTurn(n, anim) {
    const tot = st.totalCodes || 0;
    $('turn').innerHTML = n + '<small> / ' + tot + '</small>';
    $('meter').style.width = tot ? Math.min(100, n / tot * 100) + '%' : '0';
    if (anim) { const b = $('turn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  }

  function dropPapers(k) {
    for (let i = 0; i < Math.min(k, 8); i++) {
      setTimeout(() => {
        const p = document.createElement('div');
        p.className = 'pp';
        p.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
        p.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
        $('ballot').appendChild(p);
        K.SFX.pop();
        setTimeout(() => p.remove(), 1100);
      }, i * 160);
    }
  }

  $('stopBtn').onclick = async () => {
    if (!confirm('確定提前結束這一輪投票？')) return;
    await K.api('stop', { pw });
    st.endAt = K.serverNow();
  };

  /* ---------- 輪詢 ---------- */
  let pollT;
  async function poll() {
    clearTimeout(pollT);
    const sent = Date.now();
    try {
      const s = await K.api('state');
      if (s.ok) {
        K.syncClock(s.now, sent);
        st = s;
        if (mode === 'mOpen' && s.round) {
          if (s.turnout > lastTurn) { dropPapers(s.turnout - lastTurn); lastTurn = s.turnout; setTurn(s.turnout, true); }
          else setTurn(s.turnout, false);
        }
        if (mode === 'mIdle' || mode === 'mOpen') tabs();
      }
    } catch (e) {}
    pollT = setTimeout(poll, mode === 'mOpen' ? 1200 : 2500);
  }

  /* ---------- 計時與緊張效果 ---------- */
  setInterval(() => {
    if (!st || mode !== 'mOpen') return;
    const left = st.endAt - K.serverNow();
    const total = st.roundMs || 60000;
    if (left > 0) {
      timer.set(left, total);
      const s = Math.ceil(left / 1000);
      if (s !== lastSec) {
        lastSec = s;
        if (s <= 10) { K.SFX.heartbeat(); K.SFX.beep(false); }
        else if (s <= 20) K.SFX.tick();
      }
      $('vig').classList.toggle('on', s <= 10);
      document.querySelector('.stage').classList.toggle('shake', s <= 5);
      if (K.DEMO) K.demoBotTick();
    } else if (!stamped) {
      stamped = 1;
      timer.set(null, total, '時間到');
      $('vig').classList.remove('on');
      document.querySelector('.stage').classList.remove('shake');
      K.SFX.buzzer();
      const stamp = document.createElement('div');
      stamp.className = 'stamp'; stamp.innerHTML = '<span>時間到！</span>';
      document.body.appendChild(stamp);
      setTimeout(() => stamp.remove(), 1400);
      setTimeout(() => reveal(st.round, false), 1300);
    }
  }, 150);

  /* ---------- 揭曉 ---------- */
  async function reveal(r, quick) {
    if (revealing) return;
    revealing = r; sel = r;
    const p = prop(r);
    let res = null;
    if (!quick) {
      $('cTitle').textContent = p.g + '｜' + p.title;
      show('mCount'); tabs();
      K.SFX.drumroll(2.6);
      const t0 = Date.now();
      // 等伺服器寬限期結束再取結果（最多重試 8 次）
      for (let i = 0; i < 8 && !res; i++) {
        try { const x = await K.api('result', { r }); if (x.ok) res = x; } catch (e) {}
        if (!res) await new Promise(z => setTimeout(z, 700));
      }
      const wait = 2600 - (Date.now() - t0);
      if (wait > 0) await new Promise(z => setTimeout(z, wait));
    } else {
      try { const x = await K.api('result', { r }); if (x.ok) res = x; } catch (e) {}
    }
    revealing = 0;
    if (!res) { K.toast('取不到開票結果，請稍後再點一次該組', true); idle(); return; }
    revealedRound = r;
    $('rG').textContent = p.g; $('rTitle').textContent = p.title;
    $('rYes').textContent = '0'; $('rNo').textContent = '0';
    $('sideY').classList.remove('win'); $('sideN').classList.remove('win');
    $('raceY').style.width = '50%'; $('raceN').style.width = '50%'; $('raceY').textContent = ''; $('raceN').textContent = '';
    $('verdict').innerHTML = ''; $('wall').innerHTML = ''; $('rCount').textContent = res.reasons.length;
    show('mReveal'); tabs(); window.scrollTo({ top: 0 });
    timer.set(null, 60000, '已開票');
    K.SFX.cymbal();
    const dur = quick ? 600 : 2200;
    const tot = res.yes + res.no;
    setTimeout(() => {
      $('raceY').style.width = tot ? (res.yes / tot * 100) + '%' : '50%';
      $('raceN').style.width = tot ? (res.no / tot * 100) + '%' : '50%';
    }, 50);
    await Promise.all([
      K.countUp($('rYes'), res.yes, dur, () => { if (!quick) K.SFX.count(); }),
      K.countUp($('rNo'), res.no, dur),
    ]);
    if (tot) { $('raceY').textContent = Math.round(res.yes / tot * 100) + '%'; $('raceN').textContent = Math.round(res.no / tot * 100) + '%'; }
    const v = K.verdictOf(res.yes, res.no);
    if (v === 'pass') $('sideY').classList.add('win');
    if (v === 'fail') $('sideN').classList.add('win');
    $('verdict').innerHTML = '<span class="' + v + '">' + (v === 'pass' ? '通過 ✔' : v === 'tie' ? '平手 ⚖' : '未通過 ✖') + '</span>';
    if (!quick) { if (v === 'pass') { K.SFX.fanfare(); K.confetti(180); } else if (v === 'fail') K.SFX.sad(); else K.SFX.ding(); }
    setTimeout(() => { const h = document.querySelector('.wall-h'); if (h && mode === 'mReveal') window.scrollTo({ top: h.getBoundingClientRect().top + window.scrollY - 110, behavior: 'smooth' }); }, quick ? 200 : 1600);
    // 理由便利貼一張張貼上
    const gap = quick ? 30 : Math.max(120, Math.min(450, 6000 / Math.max(1, res.reasons.length)));
    if (!res.reasons.length) $('wall').innerHTML = '<p style="color:var(--muted)">這一組沒有人留下贊成理由。</p>';
    res.reasons.forEach((t, i) => {
      const n = document.createElement('div');
      n.className = 'sticky';
      n.style.setProperty('--r', (Math.random() * 6 - 3).toFixed(1) + 'deg');
      n.style.animationDelay = (0.5 + i * gap / 1000) + 's';
      n.textContent = t;
      n.onclick = () => n.classList.toggle('gone');
      $('wall').appendChild(n);
      if (!quick && i < 40) setTimeout(() => K.SFX.pop(), 500 + i * gap);
    });
  }

  $('nextBtn').onclick = () => {
    const done = (st && st.done) || [];
    let n = 0;
    for (let i = 1; i <= K.ROUNDS; i++) { const j = ((revealedRound || sel) + i - 1) % K.ROUNDS + 1; if (done.indexOf(j) < 0 && j !== revealedRound) { n = j; break; } }
    if (!n) { summary(); return; }
    sel = n; idle();
  };
  $('againBtn').onclick = () => {
    if (!confirm('重投會清除這一組目前的票數與理由，確定？')) return;
    sel = revealedRound || sel; idle();
  };

  /* ---------- 總結果 ---------- */
  async function summary() {
    show('mSum'); tabs();
    $('ranks').innerHTML = '<p class="center" style="color:var(--muted)">統計中…</p>';
    try {
      const r = await K.api('summary');
      const list = r.list.map(x => Object.assign(x, { rate: x.done && (x.yes + x.no) ? x.yes / (x.yes + x.no) : -1 }))
        .sort((a, b) => b.rate - a.rate || (b.yes || 0) - (a.yes || 0));
      const medals = ['🥇', '🥈', '🥉'];
      $('ranks').innerHTML = list.map((x, i) => {
        const v = x.done ? K.verdictOf(x.yes, x.no) : 'none';
        const pct = x.rate >= 0 ? Math.round(x.rate * 100) + '%' : (x.done ? '0 票' : '未投票');
        return '<div class="card rank ' + v + (i === 0 && x.rate >= 0 ? ' gold' : '') + '" style="animation-delay:' + ((list.length - i) * 0.35) + 's">' +
          '<div class="m">' + (x.rate >= 0 && i < 3 ? medals[i] : (i + 1)) + '</div>' +
          '<div class="t">' + K.esc(x.title) + '<small>' + K.esc(x.g) + (x.done ? '・贊成 ' + x.yes + '／不贊成 ' + x.no + '・' + K.VERDICT_TEXT[v] : '') + '</small>' +
          '<div class="rb"><i style="width:' + Math.max(0, x.rate) * 100 + '%"></i></div></div>' +
          '<div class="pct">' + pct + '</div></div>';
      }).join('');
      setTimeout(() => { K.SFX.fanfare(); K.confetti(200); }, list.length * 350 + 400);
    } catch (e) { $('ranks').innerHTML = '<p class="center">讀取失敗</p>'; }
  }
  $('sumBtn').onclick = () => { if (st && st.round && K.serverNow() < st.endAt) { K.toast('投票進行中'); return; } summary(); };
  $('backBtn').onclick = () => idle();

  $('muteBtn').onclick = () => { K.SFX.setMuted(!K.SFX.isMuted()); $('muteBtn').textContent = K.SFX.isMuted() ? '🔇' : '🔊'; };
  $('fsBtn').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

  try { const sp = sessionStorage.getItem('sdgsPw'); if (sp) $('pw').value = sp; } catch (e) {}
  show('mLogin');
})();
</script>
</body>
</html>
